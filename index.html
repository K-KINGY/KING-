<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09051a" />
  <title>七夕快乐怡子 · 浪漫烟花</title>
  <style>
    :root { --pink:#ff79bd; --gold:#ffd978; --ink:#09051a; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--ink); color:#fff; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    body { display:grid; place-items:center; }
    canvas { position:fixed; inset:0; width:100%; height:100%; touch-action:none; }
    .veil { position:fixed; inset:0; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 50% 25%, rgba(94,46,135,.35), transparent 48%), linear-gradient(180deg, rgba(9,5,26,.3), rgba(9,5,26,.72)); transition:opacity .8s ease, visibility .8s; }
    .veil.hide { opacity:0; visibility:hidden; pointer-events:none; }
    .card { width:min(90vw,420px); text-align:center; padding:34px 24px 30px; border:1px solid rgba(255,255,255,.18); border-radius:28px; background:rgba(22,10,48,.62); box-shadow:0 18px 80px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.12); backdrop-filter:blur(14px); }
    .tiny { margin:0 0 10px; letter-spacing:.28em; font-size:12px; color:rgba(255,255,255,.72); }
    h1 { margin:0; font-size:clamp(30px,10vw,54px); line-height:1.1; letter-spacing:.08em; white-space:nowrap; background:linear-gradient(120deg,#fff,#ffd978 45%,#ff79bd); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 0 28px rgba(255,121,189,.28); }
    .sub { margin:16px 0 24px; color:rgba(255,255,255,.8); font-size:14px; line-height:1.8; }
    button { border:0; border-radius:999px; padding:14px 28px; color:#32102f; font-size:16px; font-weight:700; letter-spacing:.12em; background:linear-gradient(135deg,#ffe8a3,#ff8fca); box-shadow:0 8px 30px rgba(255,121,189,.3); cursor:pointer; }
    button:active { transform:scale(.96); }
    .hint { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%); font-size:12px; color:rgba(255,255,255,.68); letter-spacing:.08em; opacity:0; transition:opacity .8s 1s; white-space:nowrap; }
    .hint.show { opacity:1; }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>
  <section class="veil" id="veil"><div class="card"><p class="tiny">给你的一场小小浪漫</p><h1>七夕快乐怡子</h1><p class="sub">愿你眼里有星河，身边有温柔，<br>每一个心愿都被烟花听见。</p><button id="open">点亮今夜</button></div></section>
  <div class="hint" id="hint">轻触屏幕，放一朵专属烟花 ✦</div>
  <script>
    const c=document.getElementById('sky'),x=c.getContext('2d');let d=Math.min(devicePixelRatio||1,2),W,H,p=[],r=[],s=[];const cs=['#ff79bd','#ffd978','#8be9fd','#b99cff','#fff','#ff9f68'];function z(){W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);s=Array.from({length:Math.max(50,W/7|0)},()=>({x:Math.random()*W,y:Math.random()*H*.72,r:Math.random()*1.3+.2,a:Math.random()*.7+.2,t:Math.random()*.02+.005}))}addEventListener('resize',z);z();function b(a,q,col){for(let i=0;i<90;i++){let n=Math.random()*Math.PI*2,v=Math.random()*4.5+1.2;p.push({x:a,y:q,vx:Math.cos(n)*v,vy:Math.sin(n)*v,l:1,k:.008+Math.random()*.014,col,size:Math.random()*2+.6})}}function l(a=Math.random()*W,q=H*(.2+Math.random()*.3)){r.push({x:a,y:H+8,vx:(Math.random()-.5)*.8,vy:-(8+Math.random()*2),q,col:cs[Math.random()*cs.length|0]})}function f(){requestAnimationFrame(f);x.fillStyle='rgba(9,5,26,.22)';x.fillRect(0,0,W,H);s.forEach(o=>{o.a+=o.t;x.globalAlpha=.35+Math.sin(o.a)*.25;x.fillStyle='#fff';x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill()});x.globalAlpha=1;r.forEach((o,i)=>{o.x+=o.vx;o.y+=o.vy;o.vy+=.05;x.fillStyle=o.col;x.beginPath();x.arc(o.x,o.y,2,0,7);x.fill();if(o.y<=o.q){b(o.x,o.y,o.col);r.splice(i,1)}});p.forEach((o,i)=>{o.x+=o.vx;o.y+=o.vy;o.vy+=.045;o.vx*=.985;o.vy*=.985;o.l-=o.k;x.globalAlpha=Math.max(0,o.l);x.fillStyle=o.col;x.beginPath();x.arc(o.x,o.y,o.size,0,7);x.fill();if(o.l<=0)p.splice(i,1)});x.globalAlpha=1}f();document.getElementById('open').onclick=()=>{document.getElementById('veil').classList.add('hide');document.getElementById('hint').classList.add('show');for(let i=0;i<4;i++)setTimeout(()=>l(W*(.2+i*.2)),i*240);setInterval(()=>l(),900)};c.addEventListener('pointerdown',e=>b(e.clientX,e.clientY,cs[Math.random()*cs.length|0]));
  </script>
</body>
</html>
